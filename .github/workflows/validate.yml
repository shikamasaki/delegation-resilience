name: Validate v0alpha profile

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install validator
        run: python -m pip install -r requirements-validation.txt
      - name: Validate JSON Schemas
        run: check-jsonschema --check-metaschema profiles/transactional-action/schema/*.json
      - name: Validate refund profile
        run: check-jsonschema --schemafile profiles/transactional-action/schema/profile.schema.json examples/refund/profile.yaml
      - name: Validate attestation fixture
        run: check-jsonschema --schemafile profiles/transactional-action/schema/attestation.schema.json tests/fixtures/valid/attestation-deterministic.yaml
      - name: Validate runtime state fixture
        run: check-jsonschema --schemafile profiles/transactional-action/schema/runtime-state.schema.json tests/fixtures/valid/runtime-state*.json
      - name: Reject invalid runtime states
        run: |
          for fixture in tests/fixtures/invalid/runtime-*.json; do
            if check-jsonschema --schemafile profiles/transactional-action/schema/runtime-state.schema.json "$fixture"; then
              echo "invalid runtime state was unexpectedly accepted: $fixture"
              exit 1
            fi
          done
      - name: Validate reference integrity and assurance semantics
        run: python tools/validate_profile.py examples/refund/profile.yaml --attestation tests/fixtures/valid/attestation-deterministic.yaml --as-of 2026-08-02T00:00:00Z
      - name: Run semantic negative tests
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Verify deterministic Refund Game Day artifacts
        run: python -m game_days.refund.runner --verify
      - name: Validate generated Refund Game Day attestation
        run: |
          check-jsonschema --schemafile profiles/transactional-action/schema/attestation.schema.json examples/refund/game-day/attestation.yaml
          python tools/validate_profile.py examples/refund/profile.yaml --attestation examples/refund/game-day/attestation.yaml --as-of 2026-08-02T00:00:00Z
